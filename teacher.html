<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>오늘 결과 · 선생님</title>
<script src="config.js"></script>
<style>
  :root {
    --paper: #fbfaf6;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #e7e3da;
    --omr: #c8243c;
    --omr-soft: #fcecee;
    --amber: #a15c00;
    --amber-soft: #fff4e0;
    --good: #2b7a3d;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 24px 60px; }

  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .brand-mark { width: 14px; height: 18px; border: 2px solid var(--omr); border-radius: 50%; position: relative; }
  .brand-mark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--ink); }

  .top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 10px 0 18px; }
  .top h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; }
  .top .sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=date], input[type=password] { height: 42px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; padding: 0 12px; font-size: 15px; }
  .btn { height: 42px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .btn:disabled { opacity: .5; }
  .auto { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .warn { background: var(--amber-soft); border: 1px solid #f0d9ae; color: #6b4300; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
  .warn b { color: #4d3000; }

  .set { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 18px; }
  .set-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .set-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .tag { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; }
  .tag.alert { color: var(--omr); border-color: #f1c4cb; background: var(--omr-soft); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 18px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }

  .label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .rates { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
  .rate { border-radius: 10px; padding: 7px 4px 6px; text-align: center; border: 1px solid var(--line); background: #fff; }
  .rate .no { font-size: 12px; color: var(--muted); font-weight: 700; }
  .rate .pct { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rate.mid { background: var(--amber-soft); border-color: #f0d9ae; }
  .rate.mid .pct { color: var(--amber); }
  .rate.low { background: var(--omr-soft); border-color: #f1c4cb; }
  .rate.low .pct { color: var(--omr); }
  .weak { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .weak b { color: var(--ink); }

  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 15px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid #f0ede6; vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.score { font-weight: 800; }
  .wn { display: inline-block; min-width: 26px; padding: 1px 6px; margin: 0 4px 4px 0; border-radius: 12px; border: 1px solid #f1c4cb; color: var(--omr); font-size: 13px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .wn.blank { border-style: dashed; color: var(--muted); border-color: #c9c5bc; }
  .muted { color: var(--muted); }

  .missing { margin-top: 16px; font-size: 14px; }
  .missing .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .missing .names span { border: 1px dashed #c9c5bc; border-radius: 16px; padding: 3px 10px; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 70px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; line-height: 1.7; }
  .login { max-width: 360px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .login h1 { margin: 10px 0 18px; font-size: 24px; }
  .login input { width: 100%; margin-bottom: 10px; height: 48px; }
  .login .btn { width: 100%; height: 48px; }
  .error { color: var(--omr); font-weight: 600; font-size: 14px; min-height: 20px; margin: 4px 0 10px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 30px; text-align: right; }

  @media (max-width: 720px) {
    .wrap { padding: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hide-sm { display: none; }
    table { font-size: 14px; }
    td, th { padding: 8px 6px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_VERSION = '1.3.0';
const KEY = 'naesin.teacher';
const $app = document.getElementById('app');
let timer = null;
let currentDate = '';

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
function fill(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); }
const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(action, data) {
  const url = (window.APP_CONFIG || {}).API_URL || '';
  if (!/^(https?:)?\//.test(url)) throw new ApiError('config.js에 서버 주소(웹 앱 URL)를 아직 넣지 않았어요.', 'CONFIG');
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data || {})) });
  } catch (e) { throw new ApiError('인터넷 연결을 확인해 주세요.', 'NETWORK'); }
  let out;
  try { out = await res.json(); } catch (e) { throw new ApiError('서버 응답을 읽지 못했어요.', 'SERVER'); }
  if (!out.ok) throw new ApiError(out.error || '문제가 생겼어요.', out.code);
  return out;
}
const fmt = (x) => (x == null ? '–' : (Math.round(x * 10) / 10).toString());
function dateLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  const w = '일월화수목금토'[new Date(y, m - 1, d).getDay()];
  return `${m}월 ${d}일 (${w})`;
}
function nowLabel() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/* ── 로그인 ── */
function showLogin(msg) {
  stopTimer();
  const err = el('div', { class: 'error', role: 'alert' }, msg || '');
  const pw = el('input', { type: 'password', placeholder: '선생님 비밀번호', autocomplete: 'current-password' });
  const btn = el('button', { class: 'btn', type: 'submit' }, '들어가기');
  $app.replaceChildren(el('form', { class: 'login', onsubmit: async (e) => {
    e.preventDefault(); err.textContent = '';
    btn.disabled = true;
    try {
      const r = await api('teacherLogin', { password: pw.value });
      store.set(KEY, { token: r.token });
      showMain();
    } catch (ex) { err.textContent = ex.message; pw.value = ''; pw.focus(); }
    finally { btn.disabled = false; }
  } },
    el('div', { class: 'brand' }, el('span', { class: 'brand-mark' }), '내신 클리닉'),
    el('h1', {}, '선생님 로그인'), pw, err, btn));
  pw.focus();
}

/* ── 오늘 결과 ── */
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

async function showMain() {
  const s = store.get(KEY);
  if (!s) return showLogin();
  const dateInput = el('input', { type: 'date', 'aria-label': '날짜', onchange: () => { currentDate = dateInput.value; load(); } });
  const refresh = el('button', { class: 'btn ghost', onclick: () => load() }, '새로고침');
  const autoBox = el('input', { type: 'checkbox', checked: true, onchange: () => setupTimer() });
  const sub = el('div', { class: 'sub' }, '불러오는 중…');
  const body = el('div');
  const foot = el('footer');
  $app.replaceChildren(el('div', { class: 'wrap' },
    el('div', { class: 'brand' }, el('span', { class: 'brand-mark' }), '내신 클리닉 · 선생님'),
    el('div', { class: 'top' },
      el('div', {}, el('h1', {}, '오늘 결과'), sub),
      el('div', { class: 'tools' },
        el('label', { class: 'auto' }, autoBox, '1분마다 새로고침'),
        dateInput, refresh,
        el('a', { class: 'btn ghost', href: 'report.html' }, '누적 리포트'),
        el('button', { class: 'btn ghost', onclick: () => { store.del(KEY); showLogin(); } }, '로그아웃'))),
    body, foot));

  let todayKey = '';
  async function load() {
    refresh.disabled = true;
    try {
      const r = await api('teacherToday', { token: s.token, date: currentDate || undefined });
      todayKey = r.today;
      currentDate = r.date;
      dateInput.value = r.date;
      const total = r.sets.reduce((a, x) => a + x.submitted, 0);
      sub.textContent = `${dateLabel(r.date)}${r.date === r.today ? ' · 오늘' : ''} · 제출 ${total}건 · ${nowLabel()} 기준`;
      fill(body,
        r.warnings.length ? el('div', { class: 'warn' },
          el('b', {}, '학생 화면에 안 보이는 세트가 있어요 (사용=Y인데 문항에 문제가 있음)'),
          r.warnings.map((w) => el('div', {}, `· ${w.title} (${w.setId}): ${w.problem}`))) : null,
        r.sets.length ? r.sets.map(renderSet) : el('div', { class: 'empty' },
          r.date === r.today ? '아직 오늘 제출한 학생이 없어요.' : `${dateLabel(r.date)}에는 제출이 없어요.`)
      );
      foot.textContent = `서버 v${r.version} · 화면 v${APP_VERSION}`;
    } catch (e) {
      if (e.code === 'AUTH') { store.del(KEY); return showLogin(e.message); }
      sub.textContent = e.message;
    } finally { refresh.disabled = false; setupTimer(); }
  }
  function setupTimer() {
    stopTimer();
    if (autoBox.checked && (!currentDate || currentDate === todayKey)) {
      timer = setInterval(() => { if (!document.hidden) load(); }, 60000);
    }
  }
  load();
}

function renderSet(x) {
  const weak = x.itemRates.filter((it) => it.rate != null && it.rate < 60);
  return el('section', { class: 'set' },
    el('div', { class: 'set-head' },
      el('h2', {}, x.title),
      x.kind === '모의평가' ? el('span', { class: 'tag alert' }, '모의평가') : null,
      x.school ? el('span', { class: 'tag' }, x.school) : el('span', { class: 'tag' }, '공통'),
      el('span', { class: 'tag' }, `제출 ${x.submitted}명`),
      x.reveal === false ? el('span', { class: 'tag' }, '학생에게 점수 비공개') : x.reveal === true ? el('span', { class: 'tag' }, '학생에게 점수 공개') : null,
      x.missing && x.missing.length ? el('span', { class: 'tag alert' }, `미제출 ${x.missing.length}명`) : null),
    el('div', { class: 'stats' },
      stat('평균', fmt(x.avg), '점'), stat('최고', fmt(x.max), '점'), stat('최저', fmt(x.min), '점'),
      stat('문항 수', String(x.itemRates.length || (x.rows[0] && x.rows[0].count) || '–'), '문항')),
    x.itemRates.length ? el('div', {},
      el('div', { class: 'label' }, '문항별 정답률'),
      el('div', { class: 'rates' }, x.itemRates.map((it) => el('div', {
        class: 'rate' + (it.rate == null ? '' : it.rate < 60 ? ' low' : it.rate < 80 ? ' mid' : ''),
        title: `${it.no}번 · 정답 ${it.answer}${it.unit ? ' · ' + it.unit : ''}${it.detail ? ' > ' + it.detail : ''}`
      }, el('div', { class: 'no' }, `${it.no}번`), el('div', { class: 'pct' }, it.rate == null ? '–' : `${it.rate}%`)))),
      weak.length ? el('p', { class: 'weak' }, el('b', {}, '정답률 60% 미만 '),
        weak.map((it) => `${it.no}번(정답 ${it.answer}${it.detail ? ', ' + it.detail : it.unit ? ', ' + it.unit : ''})`).join(' · ')) : null
    ) : null,
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', {}, '이름'), el('th', { class: 'hide-sm' }, '학교'), el('th', { class: 'num' }, '점수'),
        el('th', { class: 'num' }, '맞은 수'), el('th', {}, '틀린 문항 ', el('span', { style: 'font-weight:500' }, '(점선 = 비움)')), el('th', { class: 'num' }, '제출'))),
      el('tbody', {}, x.rows.map((r) => {
        const blank = new Set(r.blank);
        return el('tr', {},
          el('td', {}, r.name), el('td', { class: 'hide-sm muted' }, r.school),
          el('td', { class: 'num score' }, fmt(r.score)),
          el('td', { class: 'num' }, `${r.correct}/${r.count}`),
          el('td', {}, r.wrong.length ? r.wrong.map((no) => el('span', { class: 'wn' + (blank.has(no) ? ' blank' : ''), title: blank.has(no) ? '비움' : '' }, String(no))) : el('span', { class: 'muted' }, '없음')),
          el('td', { class: 'num muted' }, r.time));
      }))),
    x.missing && x.missing.length ? el('div', { class: 'missing' },
      el('div', { class: 'label' }, `미제출 (${x.school} 재원생 중 이 세트를 아직 안 낸 학생)`),
      el('div', { class: 'names' }, x.missing.map((n) => el('span', {}, n)))) : null
  );
}
function stat(k, v, unit) {
  return el('div', { class: 'stat' }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v, v !== '–' ? el('small', {}, unit) : null));
}

if (store.get(KEY)) showMain(); else showLogin();
</script>
</body>
</html>
